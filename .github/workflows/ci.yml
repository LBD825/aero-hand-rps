name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    name: contract-tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check (every .py must compile)
        shell: bash
        run: |
          python -m compileall -q agent scripts tests
          echo "compileall OK"

      - name: Contract tests (32 assertions, dry-run, no hardware)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/test_agent_dryrun.py

      - name: Pose library self-check (17 poses x 7 channels inside limits.json)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/check_poses.py
